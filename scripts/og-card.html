<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og-card</title>
    <!--
      Source of public/og-image.png, the 1200x630 social card every pasted link
      previews. Render it with scripts/build-og.ps1 after changing the headline
      or the sub-line, and keep both in step with the hero on index.html.
      Self-contained on purpose: it's opened from file://, so fonts come from
      node_modules by relative path and the tokens are copied from
      src/tokens.css rather than imported.
    -->
    <style>
      @font-face {
        font-family: 'Anton';
        src: url('../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo';
        font-weight: 400;
        src: url('../node_modules/@fontsource/archivo/files/archivo-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo';
        font-weight: 700;
        src: url('../node_modules/@fontsource/archivo/files/archivo-latin-700-normal.woff2') format('woff2');
      }

      :root {
        --work: #e23d28;
        --rest: #0e7c7b;
        --prep: #e8a33d;
        --done: #158b45;
        --base: #0f1012;
        --text: #f7f4ef;
        --muted: #9a9da3;
        --display: 'Anton', 'Arial Narrow', sans-serif;
        --body: 'Archivo', 'Segoe UI', system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--base);
        color: var(--text);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      .copy {
        position: absolute;
        left: 72px;
        top: 100px;
        width: 700px;
      }

      .eyebrow {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin-top: 22px;
        font-family: var(--display);
        font-weight: 400;
        font-size: 118px;
        line-height: 0.92;
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }

      .sub {
        margin-top: 26px;
        max-width: 440px;
        font-size: 27px;
        line-height: 1.3;
        color: #d6d3ce;
      }

      /* In flow under the sub-line, so a longer line can never run into them. */
      .dashes {
        margin-top: 30px;
        display: flex;
        gap: 8px;
      }

      .dashes i {
        width: 62px;
        height: 8px;
        border-radius: 4px;
      }

      /* ---- the phone: the hero's .demo-screen at a fixed size ---- */
      .phone {
        position: absolute;
        right: 76px;
        top: 54px;
        width: 290px;
        height: 520px;
        border-radius: 30px;
        border: 6px solid #000;
        background: var(--work);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      }

      .fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34%;
        background: rgba(0, 0, 0, 0.26);
      }

      .phone > div:not(.fill) {
        position: relative;
      }

      .top {
        padding-top: 32px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.85;
      }

      .label {
        margin-top: 30px;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .time {
        margin-top: 4px;
        font-family: var(--display);
        font-size: 110px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .plates {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 22px;
      }

      .plates i {
        width: 10px;
        height: 26px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.32);
      }

      .plates i.on {
        background: rgba(255, 255, 255, 0.85);
      }

      .plates i.now {
        background: #fff;
        height: 36px;
      }

      .next {
        margin-top: auto;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 14px 20px 18px;
        background: rgba(0, 0, 0, 0.32);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="eyebrow">CrossFit Clock</div>
      <h1>The clock that coaches.</h1>
      <p class="sub">
        Interval timer for Tabata and CrossFit. Calls your exercises and the time out loud,
        reads from across the gym, runs offline.
      </p>
      <div class="dashes">
        <i style="background: var(--work)"></i>
        <i style="background: var(--rest)"></i>
        <i style="background: var(--prep)"></i>
        <i style="background: var(--done)"></i>
      </div>
    </div>

    <div class="phone">
      <div class="fill"></div>
      <div class="top">Tabata · Rd 3/8</div>
      <div class="label">Work</div>
      <div class="time">0:14</div>
      <div class="plates">
        <i class="on"></i><i class="on"></i><i class="now"></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="next"><span>Next</span><b>Rest 0:10</b></div>
    </div>
  </body>
</html>
