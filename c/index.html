<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1012" />
    <!-- One page per code, all of them thin and duplicative; / is what should rank. -->
    <meta name="robots" content="noindex" />
    <title>Shared workout — CrossFit Clock</title>
    <meta
      name="description"
      content="A workout shared from CrossFit Clock. Type its four-character code into the app to add it."
    />
    <!-- Static on purpose: scrapers don't run JS, so a pasted code link previews
         as the app rather than naming somebody's workout. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CrossFit Clock" />
    <meta property="og:title" content="A shared workout — CrossFit Clock" />
    <meta
      property="og:description"
      content="Someone shared a workout. Open the page for its four-character code, then type that into CrossFit Clock."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/site/site.css" />
  </head>
  <body>
    <header class="site-nav">
      <a class="site-mark" href="/">CrossFit Clock</a>
      <a class="btn" href="/app/">Open the clock</a>
    </header>

    <main class="code-page" id="root">
      <p class="code-note">Looking up the code…</p>
    </main>

    <script type="module" src="/src/site/code.ts"></script>
  </body>
</html>
